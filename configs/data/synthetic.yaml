# Deterministic marker files are materialized under this ignored local-data root.
name: synthetic
root: data/raw/synthetic
num_frames: 16
image_size: 224
adapter:
  _target_: marineworld.data.synthetic.SyntheticAdapter
  version: v1
  num_frames: 16
  num_videos: 2
transforms: &videomae_transforms
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  train:
    color_jitter: 0.1
