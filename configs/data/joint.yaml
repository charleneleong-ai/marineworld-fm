# Primary joint maritime SSL corpus. Dataset probability mass is explicit, not
# proportional to the number of clips, so the smaller FVessel corpus remains visible.
name: maritime_joint
root: .
sampling_weights:
  smd: 0.5
  fvessel: 0.5
components:
  smd:
    root: data/raw/smd
    adapter:
      _target_: marineworld.data.smd.SMDAdapter
      version: v1
      num_frames: null
      annotation_format: smd_objectgt_mat
  fvessel:
    root: data/raw/fvessel
    adapter:
      _target_: marineworld.data.fvessel.FVesselAdapter
      version: v1
      fps: null
      num_frames: null
split:
  val_frac: 0.15
  test_frac: 0.15
transforms:
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  train:
    color_jitter: 0.1
