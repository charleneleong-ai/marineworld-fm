# Singapore Maritime Dataset config (video-only).
name: smd
root: data/raw/smd
num_frames: null
image_size: 224
adapter:
  _target_: marineworld.data.smd.SMDAdapter
  version: v1
  num_frames: null       # null probes each video's real frame count
  annotation_format: smd_objectgt_mat
# Domain-shift eval subsets (reported separately per plan).
sources: [onshore, onboard, nir]
split:
  val_frac: 0.15
  test_frac: 0.15
transforms:
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  train:
    color_jitter: 0.1
