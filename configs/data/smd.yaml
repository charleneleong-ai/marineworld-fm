# Singapore Maritime Dataset config (video-only).
name: smd
root: data/raw/smd
num_frames: 16
image_size: 224
adapter:
  _target_: marineworld.data.smd.SMDAdapter
  version: v1
  num_frames: 16
# Domain-shift eval subsets (reported separately per plan).
sources: [onshore, onboard, nir]
split:
  val_frac: 0.15
  test_frac: 0.15
