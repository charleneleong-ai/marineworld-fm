# Root Hydra config for MarineWorld-FM.
# Compose with: python -m marineworld.train.pretrain (v1) which loads this.
defaults:
  - data: fvessel
  - model: videomae_vit_small
  - train: pretrain
  - _self_

seed: 42
output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}

# Weights & Biases (set mode=disabled to run offline).
wandb:
  project: marineworld-fm
  mode: online
