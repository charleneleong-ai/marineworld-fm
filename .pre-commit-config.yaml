# Pre-commit hooks for marineworld-fm.
# Install with: pre-commit install && pre-commit install --hook-type pre-push
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix", "--select", "E,W,F,I,C901,PLR0915"]
      - id: ruff-format

  # Run the full suite before pushing. It needs the [train] extra and is not
  # fast (the package pulls torch), so it is gated to pre-push, not per-commit;
  # CI runs the same suite on every PR.
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: pytest -q tests/
        language: system
        pass_filenames: false
        stages: [pre-push]
