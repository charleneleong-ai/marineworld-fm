[env]
# Development environment variables for marineworld-fm.
# Source with: `mise trust && mise run <task>` or `source <(mise activate)`
PYTHONUNBUFFERED = "1"
PYTHONDONTWRITEBYTECODE = "1"

[tools]
python = "3.11.9"

[tasks]
# Install development dependencies (core + train + dev).
"setup" = "pip install -e '.[train,dev]'"

# Run all tests.
"test" = "pytest -v tests/"

# Run linting and formatting checks.
"lint" = "ruff check src/ tests/ --select E,W,F,I"
"format" = "ruff format src/ tests/"
"format:check" = "ruff format --check src/ tests/"

# Quick check: seed util import + alignment tests only.
"check:alignment" = "pytest -v tests/test_alignment.py"

# Run tests with verbose output and stop on first failure.
"test:fail-fast" = "pytest -v -x tests/"

# End-to-end synthetic VideoMAE smoke with local-only W&B logging.
"smoke" = "WANDB_MODE=offline uv run --extra train python -m marineworld.train.pretrain data=synthetic model=videomae_tiny runtime=local_smoke"

# Single-GPU runs require an explicit real-data root.
"train:l4" = "test -n \"$MARINEWORLD_DATA_ROOT\" && WANDB_MODE=online uv run --extra train python -m marineworld.train.pretrain runtime=l4 data.root=\"$MARINEWORLD_DATA_ROOT\""
"train:a100" = "test -n \"$MARINEWORLD_DATA_ROOT\" && WANDB_MODE=online uv run --extra train python -m marineworld.train.pretrain runtime=a100 data.root=\"$MARINEWORLD_DATA_ROOT\""

# Download FVessel + SMD (placeholder; requires manual download from HF/sources).
"download:datasets" = """
echo 'FVessel: https://huggingface.co/datasets/gy65896/FVessel'
echo 'SMD: https://sites.google.com/site/dilipprasad/home/singapore-maritime-dataset'
echo 'Extract into ./data/raw/{fvessel,smd}/'
"""

# Show available tasks.
"help" = "mise tasks --no-header"
