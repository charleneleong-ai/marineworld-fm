[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marineworld-fm"
version = "0.0.1"
description = "Self-supervised multimodal temporal foundation model for maritime perception"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Deps are grouped: core (always needed for data/alignment utils) and
# train (heavier ML stack). Keep core light so the alignment utility and
# tests run without a full torch install if desired.
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.1,<2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "pytorch-lightning>=2.5,<3",
    "transformers>=5.0",           # VideoMAE, V-JEPA 2, AutoVideoProcessor
    "timm>=1.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "decord>=0.6; sys_platform != 'darwin'",  # no macOS distribution
    "av>=18,<19",
    "httpx>=0.27",
    "typer>=0.16,<1",
    "wandb>=0.17",
    "motmetrics>=1.4",             # tracking eval (MOTA/IDF1)
    "scipy>=1.11",                 # native SMD ObjectGT MAT annotations
    "safetensors>=0.4",            # header-only local checkpoint validation
    "scikit-learn>=1.5",
    "httpx>=0.27",                 # explicit Hub transport error classification
    "requests>=2.31",              # legacy Hub transport error classification
    "python-dotenv>=1.0",
]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
